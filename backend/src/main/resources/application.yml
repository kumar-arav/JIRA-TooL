server:
  port: ${PORT:8080}

spring:
  application:
    name: flowsync-backend

  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  mail:
  host: smtp.gmail.com
  port: 587
  username: ${MAIL_USERNAME}
  password: ${MAIL_PASSWORD}
  properties:
    mail:
      smtp:
        auth: true
        starttls:
          enable: true
          required: true
        connectiontimeout: 30000
        timeout: 30000
        writetimeout: 30000

jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000
  refresh-expiration: 2592000000

app:
  frontend-url: ${FRONTEND_URL}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
  upload:
    max-file-size: 10MB
  ai:
    enabled: true
    mock: true

mail:
  from: ${MAIL_FROM}

logging:
  level:
    com.flowsync: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
