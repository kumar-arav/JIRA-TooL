server:
  port: ${PORT:8080}

spring:
  application:
    name: flowsync-backend

  datasource:
    url: jdbc:mysql://localhost:3306/flowsyncdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: Letmein@123
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Email (configure for production)
  mail:
    host: smtp.gmail.com
    port: 587
    username: gangab0934@gmail.com
    password: "hxvv svnd pvjr doan"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:FlowSyncSuperSecretKeyForJWTTokenSigningMustBe256BitsLongAtLeast2024}
  expiration: 604800000 # 7 days in ms
  refresh-expiration: 2592000000 # 30 days in ms

# App Configuration
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  upload:
    max-file-size: 10MB
  ai:
    enabled: true
    mock: true

# Logging
logging:
  level:
    com.flowsync: TRACE
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  info:
    title: Intellisprint API
    version: 1.0.0
    description: AI-Powered Project Management & Ticketing System API
