server:
  port: ${PORT:8080}

spring:
  application:
    name: flowsync-backend

  # H2 File-Based Database (persistent)
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:h2:file:${user.home}/.flowsync/db/flowsyncdb;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}"
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20

  # Email (configure for production)
  mail:
    host: smtp.gmail.com
    port: 587
    username: "aravskumar007@gmail.com"
    password: "evrs xuok afbs njll"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:FlowSyncSuperSecretKeyForJWTTokenSigningMustBe256BitsLongAtLeast2024}
  expiration: 604800000        # 7 days in ms
  refresh-expiration: 2592000000 # 30 days in ms

# App Configuration
app:
  cors:
    allowed-origins: http://localhost:3000
  upload:
    max-file-size: 10MB
  ai:
    enabled: true
    mock: true

# Logging
logging:
  level:
    com.flowsync: TRACE
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  info:
    title: FlowSync API
    version: 1.0.0
    description: AI-Powered Project Management & Ticketing System API
