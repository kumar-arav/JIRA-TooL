server:
  port: ${PORT:8080}

spring:
  application:
    name: flowsync-backend

  # MongoDB Configuration
  data:
    mongodb:
      uri: mongodb://localhost:27017/flowsyncdb

  # Email (configure for production)
  mail:
    host: smtp.gmail.com
    port: 587
    username: "aravskumar007@gmail.com"
    password: "evrs xuok afbs njll"
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:FlowSyncSuperSecretKeyForJWTTokenSigningMustBe256BitsLongAtLeast2024}
  expiration: 604800000 # 7 days in ms
  refresh-expiration: 2592000000 # 30 days in ms

# App Configuration
app:
  cors:
    allowed-origins: http://localhost:3000
  upload:
    max-file-size: 10MB
  ai:
    enabled: true
    mock: true

# Logging
logging:
  level:
    com.flowsync: TRACE
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# SpringDoc / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
  info:
    title: Intellisprint API
    version: 1.0.0
    description: AI-Powered Project Management & Ticketing System API
